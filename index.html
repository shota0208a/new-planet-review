<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>ご来店アンケート</title>
  <style>
    :root{
      --bg:#0d0d0f; --card:#17171b; --text:#f6f6f7; --muted:#a7a7b0;
      --accent:#d9b46d; --line:#2a2a30; --danger:#ff7b7b;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:linear-gradient(180deg,#0a0a0c,#111116);color:var(--text)}
    .wrap{max-width:620px;margin:auto;padding:24px 16px 48px}
    .brand{text-align:center;margin:10px 0 24px}
    .brand h1{font-size:26px;margin:0 0 8px}
    .brand p{color:var(--muted);margin:0;line-height:1.6}
    .card{background:rgba(23,23,27,.96);border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 12px 36px rgba(0,0,0,.22)}
    .q{font-weight:700;margin-bottom:12px}
    .stars{display:flex;gap:8px}
    .star{flex:1;border:1px solid var(--line);background:#101014;color:#777;border-radius:12px;padding:12px 0;font-size:24px}
    .star.active{border-color:var(--accent);color:#ffd875;background:#221d14}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{border:1px solid var(--line);background:#101014;color:#ddd;border-radius:999px;padding:10px 14px}
    .chip.active{border-color:var(--accent);color:#fff;background:#2b2418}
    textarea{width:100%;min-height:110px;border:1px solid var(--line);background:#101014;color:#fff;border-radius:14px;padding:14px;font-size:16px;resize:vertical}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    button.primary,button.secondary{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800}
    .primary{background:var(--accent);color:#17120a}
    .secondary{background:#28282e;color:#fff}
    .hidden{display:none}
    .result{white-space:pre-wrap;line-height:1.75;background:#0f0f13;border:1px solid var(--line);border-radius:14px;padding:16px}
    .note{font-size:12px;color:var(--muted);line-height:1.6}
    .status{font-size:13px;color:var(--muted);margin-top:10px}
    a.review{display:block;text-decoration:none;text-align:center;background:#fff;color:#111;border-radius:14px;padding:15px;font-weight:800;margin-top:10px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="/assets/new-planet-logo.jpeg" alt="NEW PLANET" style="width:min(340px,90%);border-radius:14px;display:block;margin:0 auto 14px;box-shadow:0 0 24px rgba(210,240,255,.18)"><h1 id="storeName">NEW PLANET</h1>
    <p>30秒アンケートに答えるだけ。<br>回答内容からAIが口コミ文を作成します。</p>
  </div>

  <div class="card">
    <div class="q">1. 今日の満足度は？</div>
    <div class="stars" id="stars">
      <button class="star" data-v="1">★</button>
      <button class="star" data-v="2">★</button>
      <button class="star" data-v="3">★</button>
      <button class="star" data-v="4">★</button>
      <button class="star" data-v="5">★</button>
    </div>
  </div>

  <div class="card">
    <div class="q">2. 良かったところを選んでください</div>
    <div class="chips" id="goodPoints">
      <button class="chip">スタッフ</button>
      <button class="chip">雰囲気</button>
      <button class="chip">音楽</button>
      <button class="chip">ドリンク</button>
      <button class="chip">居心地</button>
      <button class="chip">アクセス</button>
    </div>
  </div>

  <div class="card">
    <div class="q">3. 特に印象に残ったことは？</div>
    <textarea id="comment" placeholder="例：スタッフが親切だった、DJが良かった、友達と楽しめた など"></textarea>
  </div>

  <div class="card">
    <div class="q">4. また来たいと思いますか？</div>
    <div class="chips" id="returnIntent">
      <button class="chip">ぜひ来たい</button>
      <button class="chip">また来たい</button>
      <button class="chip">機会があれば</button>
    </div>
  </div>

  <button class="primary" id="generateBtn">AIで口コミを作る</button>
  <div class="status" id="status"></div>

  <div class="card hidden" id="resultCard">
    <div class="q">AIが作った口コミ</div>
    <div id="result" class="result"></div>
    <div class="row" style="margin-top:12px">
      <button class="secondary" id="copyBtn">コピー</button>
      <button class="secondary" id="regenerateBtn">作り直す</button>
    </div>
    <a class="review" id="reviewLink" href="#" target="_blank" rel="noopener">Google口コミを書く</a>
    <p class="note">内容を確認し、ご自身の体験と一致していることを確認してから投稿してください。投稿操作はお客様ご本人が行います。</p>
  </div>
</div>

<script>
const CONFIG = {
  storeName: "NEW PLANET",
  googleReviewUrl: "https://search.google.com/local/writereview?placeid=YOUR_PLACE_ID"
};

document.getElementById("storeName").textContent = CONFIG.storeName;
document.getElementById("reviewLink").href = CONFIG.googleReviewUrl;

let rating = 0;
let selectedReturn = "";

document.querySelectorAll("#stars .star").forEach(btn=>{
  btn.onclick=()=>{
    rating=Number(btn.dataset.v);
    document.querySelectorAll("#stars .star").forEach((b,i)=>b.classList.toggle("active", i<rating));
  }
});

document.querySelectorAll("#goodPoints .chip").forEach(btn=>{
  btn.onclick=()=>btn.classList.toggle("active");
});

document.querySelectorAll("#returnIntent .chip").forEach(btn=>{
  btn.onclick=()=>{
    selectedReturn=btn.textContent;
    document.querySelectorAll("#returnIntent .chip").forEach(b=>b.classList.toggle("active", b===btn));
  }
});

async function generateReview(){
  const status = document.getElementById("status");
  const btn = document.getElementById("generateBtn");
  const goodPoints = [...document.querySelectorAll("#goodPoints .chip.active")].map(x=>x.textContent);
  const comment = document.getElementById("comment").value.trim();

  if(!rating){
    status.textContent = "満足度を選んでください。";
    return;
  }

  btn.disabled = true;
  status.textContent = "口コミ文を作成しています…";

  try{
    const res = await fetch("/api/generate", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        storeName: CONFIG.storeName,
        rating,
        goodPoints,
        comment,
        returnIntent: selectedReturn
      })
    });

    const data = await res.json();
    if(!res.ok) throw new Error(data.error || "生成に失敗しました");

    document.getElementById("result").textContent = data.review;
    document.getElementById("resultCard").classList.remove("hidden");
    status.textContent = "";
    document.getElementById("resultCard").scrollIntoView({behavior:"smooth"});
  }catch(e){
    status.textContent = "エラー：" + e.message;
  }finally{
    btn.disabled=false;
  }
}

document.getElementById("generateBtn").onclick=generateReview;
document.getElementById("regenerateBtn").onclick=generateReview;

document.getElementById("copyBtn").onclick=async()=>{
  const text=document.getElementById("result").textContent;
  await navigator.clipboard.writeText(text);
  document.getElementById("copyBtn").textContent="コピーしました";
  setTimeout(()=>document.getElementById("copyBtn").textContent="コピー",1500);
};
</script>
</body>
</html>
