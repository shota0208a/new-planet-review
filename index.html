<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>NEW PLANET</title>

  <style>
    :root{
      --bg:#0d0d0f;
      --card:#17171b;
      --text:#f6f6f7;
      --muted:#a7a7b0;
      --accent:#d9b46d;
      --line:#2a2a30;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
      background:linear-gradient(180deg,#0a0a0c,#111116);
      color:var(--text);
    }

    .wrap{
      max-width:620px;
      margin:auto;
      padding:24px 16px 48px;
    }

    .language-wrap{
      display:flex;
      justify-content:flex-end;
      margin-bottom:10px;
    }

    select{
      background:#17171b;
      color:#ddd;
      border:1px solid var(--line);
      border-radius:10px;
      padding:8px 10px;
      font-size:14px;
    }

    .brand{
      text-align:center;
      margin:10px 0 24px;
    }

    .brand img{
      width:min(340px,90%);
      border-radius:14px;
      display:block;
      margin:0 auto 14px;
      box-shadow:0 0 24px rgba(210,240,255,.18);
    }

    .brand h1{
      font-size:26px;
      margin:0 0 8px;
    }

    .brand p{
      color:var(--muted);
      margin:0;
      line-height:1.6;
    }

    .card{
      background:rgba(23,23,27,.96);
      border:1px solid var(--line);
      border-radius:20px;
      padding:20px;
      margin:14px 0;
      box-shadow:0 12px 36px rgba(0,0,0,.22);
    }

    .q{
      font-weight:700;
      margin-bottom:12px;
      font-size:18px;
    }

    .stars{
      display:flex;
      gap:8px;
    }

    .star{
      flex:1;
      border:1px solid var(--line);
      background:#101014;
      color:#777;
      border-radius:12px;
      padding:12px 0;
      font-size:24px;
    }

    .star.active{
      border-color:var(--accent);
      color:#ffd875;
      background:#221d14;
    }

    .chips{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .chip{
      border:1px solid var(--line);
      background:#101014;
      color:#ddd;
      border-radius:999px;
      padding:10px 14px;
      font-size:15px;
    }

    .chip.active{
      border-color:var(--accent);
      color:#fff;
      background:#2b2418;
    }

    textarea{
      width:100%;
      min-height:110px;
      border:1px solid var(--line);
      background:#101014;
      color:#fff;
      border-radius:14px;
      padding:14px;
      font-size:16px;
      resize:vertical;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    button.primary,
    button.secondary,
    button.review{
      width:100%;
      border:0;
      border-radius:14px;
      padding:15px;
      font-size:16px;
      font-weight:800;
    }

    .primary{
      background:var(--accent);
      color:#17120a;
    }

    .secondary{
      background:#28282e;
      color:#fff;
    }

    button.review{
      background:#fff;
      color:#111;
      margin-top:10px;
    }

    button:disabled{
      opacity:.6;
    }

    .hidden{
      display:none;
    }

    .result{
      white-space:pre-wrap;
      line-height:1.75;
      background:#0f0f13;
      border:1px solid var(--line);
      border-radius:14px;
      padding:16px;
      font-size:16px;
    }

    .note{
      font-size:12px;
      color:var(--muted);
      line-height:1.6;
    }

    .status{
      font-size:13px;
      color:var(--muted);
      margin-top:10px;
    }
  </style>
</head>

<body>

    </div>

    <div class="q" id="q2"></div>

    <div class="chips" id="goodPoints">

      <button class="chip" data-key="atmosphere"></button>

      <button class="chip" data-key="drinks"></button>

    </div>
  </div>

  <div class="card">

    <textarea id="comment"></textarea>
  </div>

  <div class="card">
    <div class="q" id="q4"></div>

    <div class="chips" id="returnIntent">
      <button class="chip" data-key="definitely"></button>
      <button class="chip" data-key="again"></button>
      <button class="chip" data-key="maybe"></button>
    </div>
  </div>

  <button class="primary" id="generateBtn"></button>

  <div class="status" id="status"></div>

  <div class="card hidden" id="resultCard">

    <div class="q" id="resultTitle"></div>

    <div id="result" class="result"></div>

    <div class="row" style="margin-top:12px">
      <button class="secondary" id="copyBtn"></button>
      <button class="secondary" id="regenerateBtn"></button>
    </div>

    <button
      class="review"
      id="reviewBtn"

    ></button>

    <p class="note" id="note"></p>

</div>

// ---------------------
// 言語判定
// ---------------------

function detectLanguage() {

  const languages =
    navigator.languages?.length
      ? navigator.languages
      : [navigator.language || "en"];

  for (const item of languages) {

    const lang =
      String(item).toLowerCase();

    if (lang.startsWith("ja")) {
      return "ja";
    }

    if (lang.startsWith("ko")) {
      return "ko";
    }

    if (
      lang.startsWith("zh-tw") ||
      lang.startsWith("zh-hk") ||
      lang.includes("hant")
    ) {
      return "zh-TW";
    }

    if (lang.startsWith("zh")) {
      return "zh-CN";
    }

    if (lang.startsWith("en")) {
      return "en";
    }
  }

  return "en";
}


// 手動で選んだ言語があれば優先

  localStorage.getItem("newPlanetLanguage") ||

// ---------------------
// 表示更新
// ---------------------

function applyLanguage() {

  const t =
    TEXT[language] || TEXT.en;

  document.documentElement.lang =
    language;

  document.getElementById("languageSelect").value =
    language;

  document.getElementById("subtitle").textContent =
    t.subtitle;

  document.getElementById("q1").textContent =
    t.q1;

  document.getElementById("q2").textContent =
    t.q2;

  document.getElementById("q3").textContent =
    t.q3;

  document.getElementById("q4").textContent =
    t.q4;

  document.getElementById("comment").placeholder =
    t.placeholder;

  document.getElementById("generateBtn").textContent =
    t.generate;

  document.getElementById("resultTitle").textContent =
    t.resultTitle;

  document.getElementById("copyBtn").textContent =
    t.copy;

  document.getElementById("regenerateBtn").textContent =
    t.regenerate;

  document.getElementById("reviewBtn").textContent =
    t.review;

  document.getElementById("note").textContent =
    t.note;


  document
    .querySelectorAll("#goodPoints .chip")
    .forEach(btn => {

      btn.textContent =
        t.good[btn.dataset.key];

    });


  document
    .querySelectorAll("#returnIntent .chip")
    .forEach(btn => {

      btn.textContent =
        t.returns[btn.dataset.key];

    });
}


document.getElementById("languageSelect")
  .addEventListener("change", e => {

    language =
      e.target.value;

    localStorage.setItem(
      "newPlanetLanguage",
      language
    );

    applyLanguage();

    document
      .getElementById("resultCard")
      .classList
      .add("hidden");

    document.getElementById("status").textContent =
      "";
  });


// ---------------------
// 回答
// ---------------------

let rating = 0;
let selectedReturn = "";


document
  .querySelectorAll("#stars .star")
  .forEach(btn => {

    btn.onclick = () => {

      rating =
        Number(btn.dataset.v);

      document
        .querySelectorAll("#stars .star")
        .forEach((b,i) => {

          b.classList.toggle(
            "active",
            i < rating
          );

        });

    };

  });


document
  .querySelectorAll("#goodPoints .chip")
  .forEach(btn => {

    btn.onclick =
      () => btn.classList.toggle("active");

  });


document
  .querySelectorAll("#returnIntent .chip")
  .forEach(btn => {

    btn.onclick = () => {

      selectedReturn =
        btn.dataset.key;

      document
        .querySelectorAll("#returnIntent .chip")
        .forEach(b => {

          b.classList.toggle(
            "active",
            b === btn
          );

        });

    };

  });


// ---------------------
// AI口コミ生成
// ---------------------

async function generateReview() {

  const t =
    TEXT[language] || TEXT.en;

  const status =
    document.getElementById("status");

  const btn =
    document.getElementById("generateBtn");

  const goodPoints =
    [
      ...document.querySelectorAll(
        "#goodPoints .chip.active"
      )
    ].map(x => x.dataset.key);

  const comment =
    document
      .getElementById("comment")
      .value
      .trim();


  if (!rating) {

    status.textContent =
      t.selectRating;

    return;
  }


  btn.disabled = true;

  status.textContent =
    t.generating;


  try {

    const response =
      await fetch(
        "/api/generate",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            rating,
            goodPoints,
            comment,
            returnIntent:selectedReturn,
            language
          })
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Generation failed"
      );

    }


    document
      .getElementById("result")
      .textContent =
      data.review;


    document
      .getElementById("resultCard")
      .classList
      .remove("hidden");


    status.textContent = "";


    document
      .getElementById("resultCard")
      .scrollIntoView({
        behavior:"smooth",
        block:"start"
      });


  } catch(error) {

    status.textContent =
      t.error +
      (error.message || "Unknown error");

  } finally {

    btn.disabled = false;

  }

}


document
  .getElementById("generateBtn")
  .onclick =
  generateReview;


document
  .getElementById("regenerateBtn")
  .onclick =
  generateReview;


// ---------------------
// 共通コピー関数
// ---------------------

async function copyReviewText() {

  const text =
    document
      .getElementById("result")
      .textContent
      .trim();

  if (!text) {
    return false;
  }


  try {

    await navigator
      .clipboard
      .writeText(text);

    return true;

  } catch(error) {

    try {

      const area =
        document.createElement(
          "textarea"
        );

      area.value =
        text;

      area.style.position =
        "fixed";

      area.style.opacity =
        "0";

      document.body.appendChild(
        area
      );

      area.focus();
      area.select();

      const success =
        document.execCommand(
          "copy"
        );

      area.remove();

      return success;

    } catch {

      return false;

    }

  }

}


// ---------------------
// 通常のコピーボタン
// ---------------------

document
  .getElementById("copyBtn")
  .onclick =
  async () => {

    const t =
      TEXT[language] || TEXT.en;

    const success =
      await copyReviewText();


    if (success) {

      document
        .getElementById("copyBtn")
        .textContent =
        t.copied;


      setTimeout(() => {

        document
          .getElementById("copyBtn")
          .textContent =
          t.copy;

      },1500);

    }

  };


// ---------------------
// コピー → Google口コミ画面
// ---------------------

document
  .getElementById("reviewBtn")
  .onclick =
  async () => {

    const t =
      TEXT[language] || TEXT.en;

    const status =
      document.getElementById("status");


    const success =
      await copyReviewText();


    if (success) {

      status.textContent =
        t.copiedAndOpening;

    }


    // 少しだけ表示してからGoogleへ移動
    setTimeout(() => {

      window.location.href =
        CONFIG.googleReviewUrl;

    },350);

  };


applyLanguage();

</script>
